version: "3.8"

services:
  app:
    build: .
    container_name: ci_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      APP_URL: http://localhost:8080
      DB_HOST: db
      DB_USER: root
      DB_PASS: root
      DB_NAME: library_db
      JWT_SECRET: secret123
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: ci_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: library_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
